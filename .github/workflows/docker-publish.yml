name: Build and Push Docker Image

# Builds the website (webpage/) once and publishes it under all the
# tags anything might depend on, so they never drift apart.
#
# IMPORTANT: this image is deployed in production from the
# `nutriscore-check:latest` tag — do not remove that tag without
# confirming with whoever manages that deployment first.
on:
  push:
    branches:
      - main
    paths:
      - "webpage/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./webpage
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriscore-check:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriscore-check:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriscore-check:web-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
