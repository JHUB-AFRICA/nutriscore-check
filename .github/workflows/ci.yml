name: CI Checks

# Runs on every pull request targeting main so broken code is caught
# before merge — nothing here pushes images or deploys anything.
on:
  pull_request:
    branches: [ "main" ]

jobs:
  webpage-build:
    name: Build website (webpage/)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webpage/package-lock.json

      - name: Install dependencies
        working-directory: webpage
        run: npm ci

      - name: Build
        working-directory: webpage
        run: npm run build

  docker-build:
    name: Docker build check (webpage/)
    runs-on: ubuntu-latest
    needs: webpage-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false — this only proves the image builds. Publishing
      # to Docker Hub still happens exclusively via docker-website.yml
      # on merge to main.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./webpage
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
